<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Long-term rental homes and landlord letting services, redesigned for clearer search and simpler conversion."><title>LongTerm Lettings — Long-term rentals, made simpler</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="nav-inner"><button class="brand" onclick="show('home')"><span class="brand-mark">LT</span><span>LongTerm<span>Lettings</span></span></button><nav id="nav"><button onclick="show('search')">Find a property</button><button onclick="show('landlords')">For landlords</button><button onclick="show('how')">How it works</button><button onclick="show('faqs')">FAQs</button></nav><div class="nav-actions"><button class="saved" onclick="show('saved')">♡ <span>Saved</span></button><button class="btn primary" onclick="show('list')">Let my property</button></div><button class="menu" onclick="toggleMenu()">☰</button></div></header><div id="app"></div><footer><div class="footer-main"><div><button class="brand footer-brand" onclick="show('home')"><span class="brand-mark">LT</span><span>LongTerm<span>Lettings</span></span></button><p>Long-term rental solutions for landlords and tenants, focused on clearer choices and longer-term relationships.</p></div><div><h4>Explore</h4><button onclick="show('search')">Find a property</button><button onclick="show('landlords')">For landlords</button><button onclick="show('how')">How it works</button><button onclick="show('faqs')">FAQs</button></div><div><h4>Contact</h4><a href="mailto:enquiries@longtermlettings.co.uk">✉ enquiries@longtermlettings.co.uk</a><a href="tel:07709839507">☎ 07709 839507</a></div></div><div class="footer-bottom"><span>© 2026 LongTerm Lettings</span><span>Privacy · Terms · Accessibility</span></div></footer><div id="modal"></div><script>
const P=[
{id:1,t:'Bright 2-bed apartment near Canary Wharf',l:'London, E14',p:2350,b:2,ba:2,type:'Apartment',img:'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80',tags:['Long let','Furnished','Balcony'],a:'Available now',d:'A bright, well-kept two-bedroom apartment with an open-plan kitchen, two bathrooms and a private balcony. Convenient for Canary Wharf and the City.'},
{id:2,t:'Modern 3-bed family home with garden',l:'Croydon, CR0',p:1950,b:3,ba:2,type:'House',img:'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1200&q=80',tags:['Long let','Garden','Parking'],a:'Available 15 Oct',d:'A spacious family home with a private garden, driveway parking and flexible living space, offered on a long-term basis.'},
{id:3,t:'Character 1-bed flat in central Manchester',l:'Manchester, M1',p:1250,b:1,ba:1,type:'Apartment',img:'https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1200&q=80',tags:['Long let','Pet friendly','Unfurnished'],a:'Available 1 Nov',d:'A character-filled one-bedroom apartment close to the city centre, with high ceilings, generous storage and excellent transport links.'},
{id:4,t:'New-build 4-bed townhouse',l:'Birmingham, B15',p:2200,b:4,ba:3,type:'House',img:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=80',tags:['Long let','New build','Parking'],a:'Available now',d:'A contemporary four-bedroom townhouse with three bathrooms, modern finishes and private parking.'},
{id:5,t:'Quiet 2-bed garden flat',l:'Brighton, BN2',p:1750,b:2,ba:1,type:'Apartment',img:'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1200&q=80',tags:['Long let','Garden','Pet friendly'],a:'Available 20 Oct',d:'A calm two-bedroom garden flat with generous living space and direct access to a private outdoor area.'},
{id:6,t:'Spacious 3-bed home in Leeds',l:'Leeds, LS6',p:1450,b:3,ba:1,type:'House',img:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80',tags:['Long let','Garden','Unfurnished'],a:'Available now',d:'A comfortable three-bedroom home suited to a longer tenancy, with a rear garden and easy access to local amenities.'}];
let saved=JSON.parse(localStorage.getItem('ltl-saved')||'[]');
const card=p=>`<article class="property-card"><div class="card-image"><img src="${p.img}" alt="Rental property interior"><span class="tag">${p.a}</span><button class="heart ${saved.includes(p.id)?'active':''}" onclick="toggleSave(${p.id})">${saved.includes(p.id)?'♥':'♡'}</button></div><div class="card-body"><div class="price">£${p.p.toLocaleString()} <small>pcm</small></div><h3>${p.t}</h3><div class="location">⌖ ${p.l}</div><div class="specs"><span>🛏 ${p.b} bed</span><span>♢ ${p.ba} bath</span><span>${p.type}</span></div><div class="chips">${p.tags.map(x=>`<span>${x}</span>`).join('')}</div><button class="card-link" onclick="openProperty(${p.id})">View property →</button></div></article>`;
function hero(){return `<section class="hero"><div class="hero-overlay"></div><div class="hero-content"><div class="eyebrow">✦ Long-term rentals, made simpler</div><h1>Find a home you can<br><em>settle into.</em></h1><p>Search long-term rental homes across the UK, or let your property to a curated network of tenants looking for stability.</p><div class="hero-search"><div class="search-field">⌖<input id="heroQ" placeholder="Town, city or postcode"><button onclick="search(document.getElementById('heroQ').value)">⌕</button></div><button class="btn primary" onclick="search(document.getElementById('heroQ').value)">Search homes</button></div><div class="hero-links"><button onclick="show('landlords')">I'm a landlord →</button><span>Looking for a 3–5+ year let?</span></div></div></section><section class="trust"><div><strong>Long-term by design</strong><span>Contracts designed around longer occupancy</span></div><div><strong>Curated tenant network</strong><span>Built around long-term rental demand</span></div><div><strong>Landlord-first service</strong><span>No ongoing management fee on the core model</span></div></section>`}
function home(){return hero()+`<section class="featured"><div class="section-heading-row"><div><div class="eyebrow dark">Browse homes</div><h2>Long-term homes worth a closer look</h2><p>A sample of the redesigned search experience. Production listings would come from the property API.</p></div><button class="text-btn" onclick="show('search')">View all homes →</button></div><div class="result-grid">${P.slice(0,3).map(card).join('')}</div></section><section class="split"><div class="split-copy"><div class="eyebrow dark">For landlords</div><h2>Turn your property into a longer-term income stream.</h2><p>The original service is built around a clear landlord proposition: a curated tenant network, longer agreements and less day-to-day management.</p><div class="bullet">✓ <span>Typical 3–5+ year agreement ambition</span></div><div class="bullet">✓ <span>No upfront fee stated on the core proposition</span></div><div class="bullet">✓ <span>Tenant referencing and relationship support</span></div><button class="btn primary" onclick="show('landlords')">Explore landlord services →</button></div><img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1400&q=80" alt="Modern rental property interior" loading="lazy"></section><section class="reassurance"><div class="section-heading"><div class="eyebrow dark">Why LongTerm Lettings</div><h2>Built around the part that matters: a good long-term fit.</h2></div><div class="feature-grid"><div class="feature"><div class="feature-icon">✓</div><h3>More information upfront</h3><p>Property pages make price, availability, features and next steps easy to scan before an enquiry.</p></div><div class="feature"><div class="feature-icon">◎</div><h3>Two-sided clarity</h3><p>The experience answers the practical questions tenants and landlords have before they commit.</p></div><div class="feature"><div class="feature-icon">▣</div><h3>A specialist proposition</h3><p>The brand can differentiate through long-term tenancy expertise rather than generic portal volume.</p></div></div></section>`}
function search(q=''){window._q=q;renderSearch()};
function renderSearch(){let q=window._q||'';app.innerHTML=`<section class="search-head"><div><div class="eyebrow dark">⌕ Property search</div><h1>Find your next long-term home</h1><p>Browse homes offered with longer-term renters in mind.</p></div><div class="compact-search">⌖<input id="sq" value="${q.replaceAll('"','&quot;')}" oninput="window._q=this.value;filterResults()" placeholder="Location or postcode">⌕</div></section><div class="search-toolbar"><button class="filter-toggle" onclick="document.querySelector('.filters').classList.toggle('show')">☷ Filters</button><div class="filters"><select id="beds" onchange="filterResults()"><option value="0">Any beds</option><option value="1">1+ beds</option><option value="2">2+ beds</option><option value="3">3+ beds</option><option value="4">4+ beds</option></select><select id="max" onchange="filterResults()"><option value="0">Any price</option><option value="1500">Up to £1,500</option><option value="2000">Up to £2,000</option><option value="2500">Up to £2,500</option><option value="3000">Up to £3,000</option></select><select id="type" onchange="filterResults()"><option>Any</option><option>House</option><option>Apartment</option></select></div><div class="result-meta"><strong id="count">0</strong> homes <select id="sort" onchange="filterResults()"><option>Recommended</option><option>Price: low to high</option><option>Price: high to low</option></select></div></div><section class="results"><div class="result-grid" id="grid"></div><div class="empty" id="empty" style="display:none"><h2>No homes match those filters</h2><p>Try a wider location, higher budget or fewer bedrooms.</p><button class="btn secondary" onclick="search('')">Clear filters</button></div></section>`;filterResults()}
function filterResults(){let q=(window._q||'').toLowerCase(),beds=+(document.getElementById('beds')?.value||0),max=+(document.getElementById('max')?.value||0),type=document.getElementById('type')?.value||'Any',sort=document.getElementById('sort')?.value||'Recommended';let r=P.filter(p=>(!q||(p.l+' '+p.t).toLowerCase().includes(q))&&(!beds||p.b>=beds)&&(!max||p.p<=max)&&(type==='Any'||p.type===type));if(sort==='Price: low to high')r.sort((a,b)=>a.p-b.p);if(sort==='Price: high to low')r.sort((a,b)=>b.p-a.p);document.getElementById('count').textContent=r.length;document.getElementById('grid').innerHTML=r.map(card).join('');document.getElementById('empty').style.display=r.length?'none':'block'}
function landlords(){app.innerHTML=`<section class="land-hero"><div><div class="eyebrow dark">▣ For landlords</div><h1>A longer let, with less day-to-day work.</h1><p>LongTerm Lettings connects landlords with a curated network of tenants seeking longer-term homes. The service is built around stable agreements and a simpler ownership experience.</p><div class="actions"><button class="btn primary" onclick="show('list')">Get a passive letting quote →</button><button class="text-btn" onclick="document.getElementById('land-how').scrollIntoView()">See how it works</button></div></div><div class="land-photo"><img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=80" alt="Modern living room"></div></section><section class="land-stats"><div><strong>3–5+ years</strong><span>Typical long-term contract ambition</span></div><div><strong>£0</strong><span>No upfront fee on the core proposition</span></div><div><strong>24/7</strong><span>Tenant relationship designed for continuity</span></div></section><section class="feature-section" id="land-how"><div class="section-heading"><div class="eyebrow dark">The proposition</div><h2>Designed around passive rental income</h2><p>The existing service is differentiated less by listing volume and more by the type of tenancy it seeks to create.</p></div><div class="feature-grid"><div class="feature"><div class="feature-icon">◎</div><h3>Curated tenant network</h3><p>The current site says it works with an established network including corporate and relocation partners.</p></div><div class="feature"><div class="feature-icon">▣</div><h3>Longer agreements</h3><p>The service describes contracts commonly structured around 3–5+ years, with break-clause flexibility and annual rent reviews.</p></div><div class="feature"><div class="feature-icon">✓</div><h3>Less ongoing involvement</h3><p>The proposition is designed to reduce routine landlord involvement, with maintenance and management handled within the service model.</p></div></div></section>`}
function list(){app.innerHTML=`<section class="form-page"><div class="form-intro"><div class="eyebrow dark">▣ Let your property</div><h1>Tell us about the property. We'll take it from there.</h1><p>Share the basics below and the team can assess the property for a long-term letting opportunity. No commitment is created by submitting this enquiry.</p><div class="form-points"><span>✓ No upfront commitment</span><span>✓ Longer-term tenancy focus</span><span>✓ Property-specific conversation</span></div></div><form class="lead-form" onsubmit="event.preventDefault();this.innerHTML='<div class=success><div style=\'font-size:38px;color:#2d6a5a\'>✓</div><h2>Enquiry received</h2><p>This prototype captured your enquiry locally. Connect the form to your secure CRM/email endpoint in production.</p><button type=button class=\'btn secondary\' onclick=\'list()\'>Send another</button></div>'"><h2>Property details</h2><div class="form-grid"><label>Full name<input required placeholder="Your name"></label><label>Email address<input required type="email" placeholder="you@example.com"></label><label>Property postcode<input required placeholder="e.g. CM2 7QH"></label><label>Bedrooms<select required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4+</option></select></label><label>Bathrooms<select><option>1</option><option>2</option><option>3+</option></select></label><label>Available from<input type="date"></label><label class="full">Tell us anything useful<textarea placeholder="Property type, condition, current tenancy, target timing or anything else that may help."></textarea></label></div><button class="btn primary" type="submit">Request a property assessment →</button><small class="privacy">Production note: connect this form to a secure endpoint and published privacy policy.</small></form></section>`}
function how(){app.innerHTML=`<section class="simple-hero"><div class="eyebrow dark">✦ How it works</div><h1>Two clear paths. One simpler rental experience.</h1><p>Tenants can search for long-term homes. Landlords can submit a property for assessment and discuss a longer-term letting strategy.</p></section><section class="steps"><div class="path"><span class="path-label">For tenants</span>${[['01','Search','Start with a location, then narrow by bedrooms, budget and property type.'],['02','Compare','Review pricing, availability, features and the information that matters before viewing.'],['03','Enquire','Request a viewing or ask a question about a property.']].map(x=>`<div class=step><span>${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div><div class="path"><span class="path-label">For landlords</span>${[['01','Tell us about your property','Share the postcode, size, availability and anything important about the property.'],['02','Discuss the opportunity','The team assesses whether the property fits its long-term tenant network and service model.'],['03','Agree the right structure','If suitable, work through the proposed tenancy, terms and ongoing responsibilities.']].map(x=>`<div class=step><span>${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div></section>`}
function faqs(){let qs=['How long are the typical rental agreements?','Do landlords pay an ongoing management fee?','Who are the tenants in the network?','How are tenants referenced?','Can I enquire before my property is vacant?'];app.innerHTML=`<section class="simple-hero"><div class="eyebrow dark">FAQs</div><h1>Useful answers before you get started.</h1><p>Clear information should come before a commitment.</p></section><section class="faq-list">${qs.map((q,i)=>`<div class="faq"><button onclick="this.parentElement.classList.toggle('open')"><span>${q}</span>⌄</button><p>${i===0?'The existing service describes typical agreements of 3–5+ years, with 6–12 month break-clause flexibility and annual rent reviews. Exact terms are agreed for each property.':i===1?'The existing proposition states there is no ongoing management cost to the landlord under its core model. Confirm exact commercial terms for your property before proceeding.':i===2?'The service describes a network including corporate tenants, relocation partners, housing associations and other long-term rental operators.':i===3?'The current site says tenants are rigorously referenced using third-party referencing and current landlord references.':'Yes. The enquiry flow is intentionally lightweight so a landlord can start a conversation before committing to a listing.'}</p></div>`).join('')}</section>`}
function savedPage(){let r=P.filter(p=>saved.includes(p.id));app.innerHTML=`<section class="search-head"><div><div class="eyebrow dark">Saved homes</div><h1>Your shortlist</h1><p>Keep interesting properties in one place while you compare them.</p></div></section><section class="results">${r.length?`<div class=result-grid>${r.map(card).join('')}</div>`:`<div class=empty><h2>No saved homes yet</h2><p>Tap the heart on any property to build a shortlist.</p><button class="btn primary" onclick="show('search')">Browse homes</button></div>`}</section>`}
function show(page){document.getElementById('nav').classList.remove('mobile-open');window.scrollTo(0,0);if(page==='home')app.innerHTML=home();if(page==='search')renderSearch();if(page==='landlords')landlords();if(page==='list')list();if(page==='how')how();if(page==='faqs')faqs();if(page==='saved')savedPage()}
function search(q){window._q=q||'';show('search')}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('ltl-saved',JSON.stringify(saved)); if(document.getElementById('grid'))filterResults();else if(window.location.hash==='#saved')savedPage();else show(location.hash==='#search'?'search':'home')}
function openProperty(id){let p=P.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="modal-close" onclick="closeModal()">×</button><img src="${p.img}" alt="Rental property interior"><div class="modal-content"><span class="tag static">${p.a}</span><div class="price">£${p.p.toLocaleString()} <small>pcm</small></div><h2>${p.t}</h2><div class="location">⌖ ${p.l}</div><div class="specs"><span>🛏 ${p.b} bedrooms</span><span>♢ ${p.ba} bathrooms</span><span>${p.type}</span></div><p>${p.d}</p><div class="trust-mini">✓ Review the full listing and tenancy details before arranging a viewing.</div><button class="btn primary" onclick="alert('Demo: connect this action to the landlord enquiry API.')">Request a viewing →</button></div></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}function toggleMenu(){document.getElementById('nav').classList.toggle('mobile-open')}
const app=document.getElementById('app');show('home');
</script></body></html>
